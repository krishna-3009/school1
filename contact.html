<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="icon" type="image/avif" href="img/logo.avif">
    <link
        href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@300;400;500;600;700;800;900&family=Italianno&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f5f7ff;
        }

        /* SECTION */
        .contact {
            padding: 80px 10%;
            text-align: center;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .section-subtitle {
            color: gray;
            margin-bottom: 40px;
        }

        /* CONTAINER */
        .contact-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            text-align: left;
        }

        /* FORM */
        .contact-form form {
            display: flex;
            flex-direction: column;
        }

        .contact-form input,
        .contact-form textarea {
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            background: #eef1ff;
            outline: none;
        }

        .contact-form button {
            padding: 12px;
            border: none;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .contact-form button:hover {
            transform: translateY(-3px);
        }

        /* INFO */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        /* MAP */
        .contact-info iframe {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            border: none;
        }

        /* SUCCESS MESSAGE */
        .success {
            display: none;
            color: green;
            margin-top: 10px;
        }

        .info-box {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .info-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.12);
        }

        .map-frame {
            background: white;
            padding: 8px;
            border-radius: 14px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .back-home {
            display: inline-block;
            margin-top: 24px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        .site-footer {
            background: #14142b;
            color: #d7d7f0;
            padding: 40px 10% 20px;
            text-align: center;
        }

        .site-footer p {
            font-size: 13px;
            color: #7f7fa8;
        }
    </style>

</head>

<body>

    <section class="contact">
        <h2 class="section-title">Contact Us</h2>
        <p class="section-subtitle">We’d love to hear from you</p>

        <div class="contact-container">

            <!-- FORM -->
            <div class="contact-form">
                <form id="contactForm">
                    <input type="text" id="name" placeholder="Your Name" required>
                    <input type="email" id="email" placeholder="Your Email" required>
                    <input type="text" placeholder="Subject">
                    <textarea id="message" placeholder="Your Message" rows="5" required></textarea>
                    <button type="submit">Send Message</button>
                    <p class="success" id="successMsg">✅ Message Sent Successfully!</p>
                </form>
            </div>

            <!-- INFO -->
            <div class="contact-info">
                <div class="info-box">
                    <h4>📍 Address</h4>
                    <p>siriyan, koron, Vidyasagar,Deoghar, Jharkhand</p>
                </div>

                <div class="info-box">
                    <h4>📞 Phone</h4>
                    <p>+91 9876543210</p>
                </div>

                <div class="info-box">
                    <h4>📧 Email</h4>
                    <p>shantiniketanschool11@gmail.com</p>
                </div>

                <!-- MAP -->
                <div class="map-frame">
                    <iframe src="https://maps.google.com/maps?q=Siriyan,Jharakhand,India&z=15&output=embed" title="School location map" loading="lazy">
                    </iframe>
                </div>
            </div>

        </div>

        <a href="index.html" class="back-home">&larr; Back to Home</a>
    </section>

    <footer class="site-footer">
        <p>&copy; 2026 Shanti Niketan Public School. All rights reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

    <script>
        (function () {
            emailjs.init("NCkC3gwl8Ls2g0xWN");
        })();

        document.getElementById("contactForm").addEventListener("submit", function (e) {
            e.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let message = document.getElementById("message").value.trim();

            // VALIDATION
            if (name === "" || email === "" || message === "") {
                alert("Please fill all required fields!");
                return;
            }

            // SEND EMAIL
            emailjs.send("service_y8sf0dy", "template_21mgqjd", {
                from_name: name,
                from_email: email,
                message: message
            })
                .then(function () {
                    document.getElementById("successMsg").style.display = "block";
                    document.getElementById("contactForm").reset();
                })
                .catch(function (error) {
                    alert("❌ Failed to send message");
                    console.log(error);
                });
        });
    </script>

</body>

</html>
